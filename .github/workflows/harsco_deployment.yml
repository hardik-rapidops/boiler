# This is a basic workflow that is manually triggered

name: Harsco Deployment

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "greet"
  build-and-deploy-on-dev:
    # The type of runner that the job will run on
    name: Generating Dev Build
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Use Node.js 16.20.2
        uses: actions/setup-node@v1
        with:
          node-version: '16.20.2'
      - name: Checkout Step
        id: checkout
        uses: actions/checkout@v1
      - name: Upload Local Build
        id: build
        run: ./build.sh
      - name: Get the output time
        run: echo "The time was ${{ env.BUILD_TIME }}"
      - name: Generate Local Build Number
        id: buildNumber
        run: ./generateBuildNumber.sh
      - name: Upload Build File
        uses: actions/upload-artifact@v4
        with:
          name: harsco file
          path: harsco.tar.gz   
      - name: Upload file to dev bucket
        uses: zdurham/s3-upload-github-action@master
        env:
          FILE: harsco.tar.gz
          AWS_REGION: 'us-east-1'
          S3_BUCKET: harsco-deployment.vensi.com
          S3_KEY: dev/${{ env.BUILD_NUMBER }}/
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Build Deployed to DEV
        run: echo "Build Deployed to DEV"
  deploy-on-production:
    name: Generating Production Build
    runs-on: ubuntu-latest
    needs: build-and-deploy-on-dev
    if: github.ref == 'refs/heads/master'
    steps:
      - name: build-and-deploy
        uses: actions/download-artifact@v4
        with:
          name: harsco file  
      - name: Generate Prod Build Number
        run: |
          BUILD_NUMBER=$(date +%Y%m%d)
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV    
      - name: Upload file to prod bucket
        uses: zdurham/s3-upload-github-action@master
        env:
          FILE: harsco.tar.gz
          AWS_REGION: 'us-east-1'
          S3_BUCKET: harsco-deployment.vensi.com
          S3_KEY: prd/${{ env.BUILD_NUMBER }}/
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Build Deployed to Production
        run: echo "Build Deployed to PRODUCTION"  
