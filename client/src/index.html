    <script type="text/javascript">
        // function startAngularApp() {
        console.log("👉 Bootstrapping Angular app...");
        angular.bootstrap(document, ["harsco-pk"]);
        // }
        function onDeviceReady() {
            try {
                if (navigator.splashscreen) navigator.splashscreen.hide();

                if (!window.FirebasePlugin) {
                    console.warn("FirebasePlugin is NOT available yet");
                    return;
                }

                console.log("✅ FirebasePlugin is available");

                // 1️⃣ Check permission first
                FirebasePlugin.hasPermission(
                    function (hasPermission) {
                        console.log(
                            "Notification permission already granted? ",
                            hasPermission
                        );

                        if (!hasPermission) {
                            // Ask only if not already granted
                            FirebasePlugin.grantPermission(
                                function (granted) {
                                    console.log(
                                        "Permission granted now: ",
                                        granted
                                    );
                                    initFirebasePush();
                                },
                                function (error) {
                                    console.error(
                                        "Permission request error:",
                                        error
                                    );
                                }
                            );
                        } else {
                            // Already granted, proceed immediately
                            initFirebasePush();
                        }
                    },
                    function (error) {
                        console.error("Error checking permission:", error);
                        // fallback: try initializing anyway
                        initFirebasePush();
                    }
                );

                // Handle back button exit
                document.addEventListener(
                    "backbutton",
                    function (e) {
                        e.preventDefault();
                        if (
                            confirm(
                                "Are you sure you want to exit from the app?"
                            )
                        ) {
                            navigator.app.exitApp();
                        }
                    },
                    false
                );
            } catch (e) {
                console.error("🔥 Device ready error:", e);
            }
        }

        function initFirebasePush() {
            try {
                // iOS-only: Listen for APNs token
                window.FirebasePlugin.onApnsTokenReceived(function (apnsToken) {
                    console.log("📱 APNs Device Token:", apnsToken);
                });

                // Get FCM token
                FirebasePlugin.getToken(
                    function (token) {
                        console.log("🎯 Firebase FCM Token:", token);
                        // send this token to your server
                    },
                    function (error) {
                        console.error("❌ Firebase getToken error:", error);
                    }
                );

                // Listen for FCM token refresh
                FirebasePlugin.onTokenRefresh(function (newToken) {
                    console.log("🔄 FCM token refreshed:", newToken);
                });
            } catch (err) {
                console.error("🔥 initFirebasePush error:", err);
            }
        }

        console.log("navigator071025.userAgent--->", navigator.userAgent);
        console.log("window.cordova", window.cordova);

        if (navigator.userAgent.match(/(iPhone|iPod|iPad|Android)/)) {
            // document.addEventListener("deviceready", onDeviceReady, false);
            // startAngularApp();
            document.addEventListener(
                "deviceready",
                function () {
                    console.log(">>>>>--- Cordova deviceready fired!");
                    onDeviceReady();
                },
                false
            );
        } else {
            console.log("worked on web");
            // startAngularApp();
        }
    </script>
