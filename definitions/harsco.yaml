definitions:
  x-any:
    properties: {}
  AccessToken:
    properties:
      id:
        type: string
      ttl:
        default: 1209600
        description: time to live in seconds (2 weeks by default)
        type: number
        format: double
      created:
        type: string
        format: date
      userId:
        type: number
        format: double
    required:
      - id
    additionalProperties: false
  User:
    properties:
      realm:
        type: string
      username:
        type: string
      credentials:
        type: object
      challenges:
        type: object
      email:
        type: string
      emailVerified:
        type: boolean
      status:
        type: string
      created:
        type: string
        format: date
      lastUpdated:
        type: string
        format: date
      id:
        type: number
        format: double
    required:
      - email
    additionalProperties: false
  Site:
    properties:
      Address:
        type: string
      City:
        type: string
      Description:
        type: string
      Name:
        type: string
      State:
        type: string
      Zip:
        type: string
      id:
        type: number
        format: double
    required:
      - Name
      - Zip
    additionalProperties: false
  Boiler:
    properties:
      Name:
        type: string
      Description:
        type: string
      Model:
        type: string
      NuroSN:
        type: string
      SolaSN:
        type: string
      id:
        type: number
        format: double
    required:
      - Name
    additionalProperties: false
  Notification:
    properties:
      propertyName61:
        type: string
      id:
        type: number
        format: double
    additionalProperties: false
  Record:
    properties:
      Received:
        type: string
        format: date
      Reported:
        type: string
        format: date
      id:
        type: number
        format: double
    required:
      - Received
      - Reported
    additionalProperties: false

