upstream harsco_upstream {
    server 127.0.0.1:3030;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

#proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=my_cache:10m max_size=10g inactive=60m use_temp_path=off;

server {
    listen         80 default_server;
    server_name    _;

    if ($http_x_forwarded_proto = "http") {
       return 301 https://$host$request_uri;
    }

    # Add HSTS
    add_header Strict-Transport-Security "max-age=7776000; includeSubDomains" always;

    proxy_buffering off;

    client_max_body_size 100G;
    client_body_timeout 300s;

    client_body_in_file_only clean;
    client_body_buffer_size 32K;
    client_body_temp_path /home/ec2-user/client_body_temp;

    root /home/ec2-user/harsco/client/www;

    access_log "/home/ec2-user/harsco/nginx_logs/access.log";
    error_log "/home/ec2-user/harsco/nginx_logs/error.log" warn;

    charset utf-8;

    default_type  application/octet-stream;
    sendfile        on;

    # enable gzip
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length  1000;
    gzip_proxied any;
    gzip_buffers 16 8k;

    # we only gzip these mime-types (since there's no use to gzip jpegs)
    #    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # tell-client to cache all 'assets'
    #    location ~* \.(?:jpg|jpeg|gif|png|ico|gz|svg|svgz|mp4|ogg|ogv|webm)$ {
    #       proxy_cache my_cache;
    #        access_log off;
    #        add_header Cache-Control "public";
    #    }

    # CSS and Javascript
    #    location ~* \.(?:css|js)$ {
    #     proxy_cache my_cache;
    #      access_log off;
    #      add_header Cache-Control "public";
    #    }

    # disable logging for some `common` files
    # Disable logging for favicon
        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

    # Disable logging for robots.txt
        location = /robots.txt {
            allow all;
            log_not_found off;
            access_log off;
        }

    # Prevent clients from accessing hidden files (starting with a dot)
        location ~* (^|/)\. {
            return 403;
        }

    # Prevent clients from accessing to backup/config/source files
        location ~* (\.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)|~)$ {
            return 403;
        }

    # reverse-proxy here, if your have multiple machine/cores would be better to use UPSTREAM so nginx can load-balance requests
    try_files $uri $uri/ @mynodeserver;
    location @mynodeserver {
        proxy_redirect off;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-NginX-Proxy true;
        proxy_set_header   Connection "";
        proxy_pass         http://harsco_upstream;
    }
}

